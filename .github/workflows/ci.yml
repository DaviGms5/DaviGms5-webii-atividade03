# Pipeline de integração contínua: valida cada pull request e cada push na main.
name: CI - Testes Automatizados

# Gatilhos: quando o workflow é executado.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Menor privilégio: o token do workflow só pode ler o repositório.
permissions:
  contents: read

jobs:
  test:
    name: Executar testes
    runs-on: ubuntu-latest

    # O banco de testes vem de um secret; nenhuma credencial fica no arquivo.
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o Prisma Client
        run: npm run db:generate

      - name: Aplicar as migrações no banco de testes
        run: npm run db:migrate

      # Enquanto a atividade da aula 12 está pendente, roda as regressões e a prática.
      - name: Executar os testes
        run: npm run test:pratica
